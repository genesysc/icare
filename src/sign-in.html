<!--
  iCare candidate sign-up / sign-in — SPRINTS.md Sprint 1.

  One page serves both /sign-up and /sign-in (same file, mounted at both
  routes in index.ts) — default mode is read from window.location.pathname,
  and a toggle link switches it client-side. Avoids maintaining two near-
  identical files for what's really one form with a name field that shows
  or hides.

  Posts to the EXISTING POST /auth/request-code (no backend changes this
  sprint). On success, redirects to /verify?email=... — the verify step
  itself doesn't need to know sign-up vs sign-in, since role/full_name/
  terms_version are already staged server-side by request-code's `data`
  payload on signInWithOtp.
-->

<script>
(function () {
  var GA_ID = "G-00D0TMNYLD";
  var KEY = "icare_analytics_consent"; // "granted" | "denied"

  function loadGA() {
    if (window.__icareGaLoaded) return;
    window.__icareGaLoaded = true;
    window.dataLayer = window.dataLayer || [];
    window.gtag = function () {
      window.dataLayer.push(arguments);
    };
    var s = document.createElement("script");
    s.async = true;
    s.src = "https://www.googletagmanager.com/gtag/js?id=" + GA_ID;
    document.head.appendChild(s);
    window.gtag("js", new Date());
    window.gtag("config", GA_ID);
  }

  var stored;
  try {
    stored = localStorage.getItem(KEY);
  } catch (e) {}

  if (stored === "granted") {
    loadGA();
    return;
  }
  if (stored === "denied") return;

  document.addEventListener("DOMContentLoaded", function () {
    var bar = document.createElement("div");
    bar.setAttribute("role", "region");
    bar.setAttribute("aria-label", "Cookie consent");
    bar.style.cssText =
      "position:fixed;left:0;right:0;bottom:0;z-index:9999;background:#1B1530;color:#fff;" +
      "padding:16px 20px;display:flex;gap:16px;align-items:center;flex-wrap:wrap;" +
      "font:14px/1.5 system-ui,-apple-system,'Segoe UI',sans-serif;box-shadow:0 -2px 12px rgba(0,0,0,.15);";
    bar.innerHTML =
      '<span style="flex:1;min-width:220px;">We use Google Analytics to understand how visitors use this site. ' +
      'No analytics cookies are set unless you accept. <a href="/privacy" style="color:#9DE8DE;">Privacy policy</a></span>' +
      '<span style="display:flex;gap:8px;">' +
      '<button type="button" data-icare-consent="reject" style="background:transparent;border:1px solid #6E58A0;color:#fff;border-radius:999px;padding:8px 16px;font:inherit;cursor:pointer;">Reject</button>' +
      '<button type="button" data-icare-consent="accept" style="background:#00A499;border:0;color:#fff;border-radius:999px;padding:8px 16px;font:inherit;cursor:pointer;font-weight:600;">Accept</button>' +
      "</span>";
    document.body.appendChild(bar);
    bar.addEventListener("click", function (e) {
      var choice = e.target && e.target.getAttribute && e.target.getAttribute("data-icare-consent");
      if (!choice) return;
      try {
        localStorage.setItem(KEY, choice === "accept" ? "granted" : "denied");
      } catch (err) {}
      if (choice === "accept") loadGA();
      bar.remove();
    });
  });
})();
</script>

<script>
// Found 2026-09-14: a signup confirmation link landed here with an unhandled
// #access_token=...&refresh_token=... hash — GoTrue's Redirect URLs allow-list
// (or Site URL) fell back to this page instead of /verify, dropping a valid
// session on a page with no code to read it. Same class of bug as the
// landing.html fix from Sprint 24, just a different fallback target this
// time — which is exactly why this needs to be on every page a magic link
// could plausibly land on, not just one. Recovers by forwarding to /verify,
// which already knows how to complete sign-in from this hash.
// Do not remove without checking HANDOVER.md §6.
(function () {
  if (window.location.hash.indexOf("access_token=") !== -1) {
    // 2026-09-16: a password-reset link ends up with this exact same
    // #access_token= shape (GoTrue's implicit flow appends the hash the
    // same way for every action), but it also carries type=recovery,
    // and reset-password.html is the page that knows how to show a
    // "set new password" form from it -- /verify would just complete a
    // silent sign-in and skip the reset entirely. Every other type
    // (signup confirmation, magic-link sign-in) keeps going to /verify
    // as before.
    var target = window.location.hash.indexOf("type=recovery") !== -1 ? "/reset-password" : "/verify";
    window.location.replace(target + window.location.hash);
  }
})();
</script>

<script>
// ---- Shared auth helper (src/auth-client.js, copied per this repo's no-build-step convention) ----
var ICARE_SESSION_KEY = "icare_session";
function icareSetSession(session) {
  try { localStorage.setItem(ICARE_SESSION_KEY, JSON.stringify(session)); } catch (e) {}
}
function icareAuthFetch(url, options) {
  var raw = null;
  try { raw = localStorage.getItem(ICARE_SESSION_KEY); } catch (e) {}
  var session = raw ? JSON.parse(raw) : null;
  options = options || {};
  var headers = Object.assign({}, options.headers || {});
  if (session && session.access_token) headers["Authorization"] = "Bearer " + session.access_token;
  return fetch(url, Object.assign({}, options, { headers: headers }));
}
// ---- End shared auth helper ----

(function () {
  var TERMS_VERSION = "2026-08-26-draft";

  // Two independent axes: signup vs. signin, password vs. otp — every
  // combination is a real, working mode. Password is the default method
  // for both audiences now; otp is kept as an explicit fallback (see
  // auth.ts — useful when email delivery of a link is easier to trust
  // than a password, or before OAuth providers are configured).
  var isSignup = false;
  var isOtp = false;

  function applyMode() {
    document.body.classList.toggle("mode-signup", isSignup);
    document.body.classList.toggle("mode-otp", isOtp);

    document.querySelector("[data-title]").textContent = isSignup ? "Join iCare" : "Welcome back";
    document.querySelector("[data-sub]").textContent =
      isOtp ? "We'll email you a one-time code, no password needed." :
      isSignup ? "Create your candidate account with an email and password." :
      "Sign in with your email and password.";

    document.querySelector("[data-toggle-signin]").style.display = isSignup ? "none" : "inline";
    document.querySelector("[data-toggle-signup]").style.display = isSignup ? "inline" : "none";

    var methodToggle = document.querySelector("[data-method-toggle]");
    methodToggle.textContent = isOtp
      ? (isSignup ? "Sign up with a password instead" : "Sign in with a password instead")
      : (isSignup ? "Sign up with a code instead" : "Sign in with a code instead");

    document.getElementById("full-name").required = isSignup;
    document.getElementById("terms").required = isSignup;
    document.getElementById("password").required = !isOtp;
    document.getElementById("password-confirm").required = isSignup && !isOtp;

    submitBtn.textContent = isOtp ? "Send me a code" : (isSignup ? "Create account" : "Sign in");

    var path = isSignup ? "/sign-up" : "/sign-in";
    try { history.replaceState(null, "", path); } catch (e) {
      // Some contexts (e.g. file:// during local testing) disallow replaceState —
      // the mode toggle still works via body class, just without updating the URL bar.
    }
  }

  var form = document.getElementById("auth-form");
  var statusEl = document.querySelector("[data-status]");
  var submitBtn = document.querySelector("[data-submit]");
  function setStatus(kind, message) {
    statusEl.textContent = message;
    statusEl.className = "status is-visible " + kind;
  }
  function clearStatus() {
    statusEl.className = "status";
  }

  isSignup = window.location.pathname === "/sign-up";
  applyMode();

  document.querySelectorAll("[data-switch]").forEach(function (btn) {
    btn.addEventListener("click", function () {
      clearStatus();
      isSignup = btn.getAttribute("data-switch") === "signup";
      applyMode();
    });
  });
  document.querySelector("[data-method-toggle]").addEventListener("click", function () {
    clearStatus();
    isOtp = !isOtp;
    applyMode();
  });

  // Show/hide password icon toggles — shared by the password and
  // confirm-password fields.
  document.querySelectorAll("[data-password-toggle]").forEach(function (btn) {
    var input = document.getElementById(btn.getAttribute("data-password-toggle"));
    btn.addEventListener("click", function () {
      var showing = input.type === "text";
      input.type = showing ? "password" : "text";
      btn.setAttribute("aria-pressed", String(!showing));
      btn.setAttribute("aria-label", showing ? "Show password" : "Hide password");
      btn.querySelector("[data-icon-show]").style.display = showing ? "" : "none";
      btn.querySelector("[data-icon-hide]").style.display = showing ? "none" : "";
    });
  });

  // Carry the typed email into the forgot-password page.
  document.querySelector("[data-forgot-link]").addEventListener("click", function () {
    var email = document.getElementById("email").value.trim();
    this.href = email ? "/reset-password?email=" + encodeURIComponent(email) : "/reset-password";
  });

  function redirectByRole() {
    return icareAuthFetch("/auth/me")
      .then(function (res) { return res.json().then(function (body) { return { ok: res.ok, body: body }; }); })
      .then(function (meResult) {
        var role = meResult.ok && meResult.body.account ? meResult.body.account.role : "candidate";
        if (role === "employer") {
          window.location.href = "/employer/home";
          return;
        }
        return icareAuthFetch("/candidates/me")
          .then(function (res) { return res.json().then(function (body) { return { ok: res.ok, body: body }; }); })
          .then(function (candidateResult) {
            var onboardingDone = candidateResult.ok && candidateResult.body.candidate && candidateResult.body.candidate.onboarding_done;
            window.location.href = onboardingDone ? "/dashboard" : "/onboarding";
          });
      })
      .catch(function () { window.location.href = "/onboarding"; });
  }

  form.addEventListener("submit", function (e) {
    e.preventDefault();
    var email = document.getElementById("email").value.trim();
    var fullName = document.getElementById("full-name").value.trim();
    var password = document.getElementById("password").value;
    var passwordConfirm = document.getElementById("password-confirm").value;
    var termsAccepted = document.getElementById("terms").checked;

    if (!email) { setStatus("err", "Please enter your email address."); return; }
    if (isSignup && (!fullName || !termsAccepted)) {
      setStatus("err", "Please enter your name and accept the Terms to continue.");
      return;
    }
    if (!isOtp && !password) {
      setStatus("err", "Please enter your password.");
      return;
    }
    if (isSignup && !isOtp) {
      if (password.length < 8) { setStatus("err", "Password must be at least 8 characters."); return; }
      if (password !== passwordConfirm) { setStatus("err", "Passwords don't match."); return; }
    }

    clearStatus();
    submitBtn.disabled = true;

    if (!isOtp && !isSignup) {
      submitBtn.textContent = "Signing in…";
      fetch("/auth/sign-in-password", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ email: email, password: password }),
      })
        .then(function (res) { return res.json().then(function (body) { return { ok: res.ok, body: body }; }); })
        .then(function (result) {
          if (!result.ok) {
            submitBtn.disabled = false;
            submitBtn.textContent = "Sign in";
            setStatus("err", (result.body.error || "Something went wrong. Please try again.") +
              " If you haven't set a password yet, use “Sign in with a code” below, or reset your password.");
            return;
          }
          setStatus("ok", "You're in — taking you to your account…");
          icareSetSession(result.body.session);
          return redirectByRole();
        })
        .catch(function () {
          submitBtn.disabled = false;
          submitBtn.textContent = "Sign in";
          setStatus("err", "Network error — please try again.");
        });
      return;
    }

    if (!isOtp && isSignup) {
      submitBtn.textContent = "Creating account…";
      fetch("/auth/sign-up-password", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ email: email, password: password, role: "candidate", full_name: fullName, terms_version: TERMS_VERSION }),
      })
        .then(function (res) { return res.json().then(function (body) { return { ok: res.ok, body: body }; }); })
        .then(function (result) {
          if (!result.ok) {
            submitBtn.disabled = false;
            submitBtn.textContent = "Create account";
            setStatus("err", result.body.error || "Something went wrong. Please try again.");
            return;
          }
          if (result.body.session) {
            // Email confirmation is off on this project — rare, but handle it.
            icareSetSession(result.body.session);
            setStatus("ok", "You're in — taking you to your account…");
            return redirectByRole();
          }
          window.location.href = "/verify?email=" + encodeURIComponent(email) + "&role=candidate&flow=signup-password";
        })
        .catch(function () {
          submitBtn.disabled = false;
          submitBtn.textContent = "Create account";
          setStatus("err", "Network error — please try again.");
        });
      return;
    }

    // OTP path (both signup and signin) — unchanged from the original flow.
    submitBtn.textContent = "Sending…";
    var payload = { email: email, create: isSignup };
    if (isSignup) {
      payload.role = "candidate";
      payload.full_name = fullName;
      payload.terms_version = TERMS_VERSION;
    }

    fetch("/auth/request-code", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify(payload),
    })
      .then(function (res) { return res.json().then(function (body) { return { ok: res.ok, body: body }; }); })
      .then(function (result) {
        submitBtn.disabled = false;
        submitBtn.textContent = "Send me a code";
        if (!result.ok) {
          setStatus("err", result.body.error || "Something went wrong. Please try again.");
          return;
        }
        window.location.href = "/verify?email=" + encodeURIComponent(email) + "&role=candidate";
      })
      .catch(function () {
        submitBtn.disabled = false;
        submitBtn.textContent = "Send me a code";
        setStatus("err", "Network error — please try again.");
      });
  });

  document.querySelectorAll("[data-oauth]").forEach(function (btn) {
    btn.addEventListener("click", function () {
      clearStatus();
      if (isSignup && !document.getElementById("terms").checked) {
        setStatus("err", "Please accept the Terms to continue.");
        return;
      }
      var provider = btn.getAttribute("data-oauth");
      btn.disabled = true;
      fetch("/auth/oauth/" + provider, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ role: "candidate", flow: isSignup ? "oauth-signup" : "oauth-signin" }),
      })
        .then(function (res) { return res.json().then(function (body) { return { ok: res.ok, body: body }; }); })
        .then(function (result) {
          if (!result.ok || !result.body.url) {
            btn.disabled = false;
            setStatus("err", result.body.error || "That sign-in option isn't available right now.");
            return;
          }
          window.location.href = result.body.url;
        })
        .catch(function () {
          btn.disabled = false;
          setStatus("err", "Network error — please try again.");
        });
    });
  });
})();
</script>
</body>
</html>
