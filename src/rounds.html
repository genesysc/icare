<!--
  iCare candidate Rounds (feed) — SPRINTS.md Sprint 22, identity model
  corrected Sprint 24, renamed from Home and extended 2026-09-12.

  Formerly "Home" — renamed to "Rounds" to match sector vocabulary
  (deliberate departure from LinkedIn/Facebook naming) and to match the
  build spec this session shipped from. Route is now /rounds; /home
  redirects here (see index.ts) for anything that still links the old path.

  Sprint 24 correction (unchanged by this pass): attribution shows real
  name and photo, not the anonymised headline/profession/town Sprint 22
  originally used — within iCare, everyone is assumed a fellow healthcare
  professional. Photo fetched per post via GET /candidates/:id/photo (not
  consent-gated — see that route's own comment), rendered as a blob
  object URL.

  Posts can be marked "Connections only" at compose time (migration
  0030's candidate_posts.visibility, unchanged) — the feed only ever
  receives rows the backend already decided to include, so this page
  trusts what GET /candidates/feed returns rather than re-filtering
  client-side.

  2026-09-12 additions:
  - Composer gained a progressive-disclosure "+ Add to your post" reveal
    (Photo/Video/Document/Mention/Check-in) — collapsed by default, same
    Facebook-style correction the build spec called out. A standing
    safeguarding line sits under it at all times: "Don't upload anything
    that could identify a person you support" — a real concern specific
    to care work, not general social-app boilerplate.
  - Check-in is a searchable venue field (GET /checkin/venues — this
    platform's own employer directory first, OpenStreetMap Nominatim to
    fill in training centres/conferences), never free text or device
    geolocation — an open "check in anywhere" feature could broadcast a
    domiciliary client's home address mid-visit.
  - @Mentions are platform-wide (GET /mention-search), not limited to
    connections — equivalent to what Network's directory already shows.
  - Reactions ("Helpful", exactly one type, no share/repost) and
    comments, via toggle_post_reaction()/add_post_comment() (migration
    0035) — re-check the same visibility rule the feed itself uses, so a
    candidate can't react to or comment on something they can't see.
  - Removed the Profile-strength card that lived here — profile
    completeness belongs on Profile/dashboard.html, not the feed.
-->

<style>
  :root {
    --plum-950: #241533;
    --plum-800: #382349;
    --ink-soft: #5b5670;
    --ink-faint: #8a8599;
    --teal-700: #0e8c7f;
    --teal-500: #16b8a6;
    --teal-100: #e3faf6;
    --amber-600: #b8791f;

  .nav { padding: 22px 24px; display: flex; align-items: center; justify-content: space-between; }
  .logo { font-family: "Fraunces", serif; font-weight: 600; font-size: 20px; color: var(--plum-950); text-decoration: none; }

  .sign-out:hover { color: var(--teal-700); }

<script>
var ICARE_SESSION_KEY = "icare_session";
function icareGetSession() {
  try { var raw = localStorage.getItem(ICARE_SESSION_KEY); return raw ? JSON.parse(raw) : null; } catch (e) { return null; }
}
function icareClearSession() {
  try { localStorage.removeItem(ICARE_SESSION_KEY); } catch (e) {}
}
function icareIsSessionExpired(session) {
  if (!session || !session.expires_at) return true;
  return Date.now() >= session.expires_at * 1000;
}
function icareAuthFetch(url, options) {
  var session = icareGetSession();
  options = options || {};
  var headers = Object.assign({}, options.headers || {});
  if (session && session.access_token) headers["Authorization"] = "Bearer " + session.access_token;
  if (options.body && typeof options.body === "string" && !headers["Content-Type"]) headers["Content-Type"] = "application/json";
  return fetch(url, Object.assign({}, options, { headers: headers }));
}
function icareRequireAuth(signInPath) {
  var session = icareGetSession();
  if (!session || icareIsSessionExpired(session)) {
    icareClearSession();
    var next = encodeURIComponent(window.location.pathname + window.location.search);
    window.location.href = (signInPath || "/sign-in") + "?next=" + next;
    return null;
  }
  return session;
}

(function () {
  var session = icareRequireAuth();
  if (!session) return;
  var myId = session.user && session.user.id;

  function jget(url) {
    return icareAuthFetch(url).then(function (res) { return res.json().then(function (body) { return { ok: res.ok, status: res.status, body: body }; }); });
  }
  function jpost(url, payload) {
    return icareAuthFetch(url, { method: "POST", body: JSON.stringify(payload || {}) })
      .then(function (res) { return res.json().then(function (body) { return { ok: res.ok, status: res.status, body: body }; }); });
  }

  function timeAgo(iso) {
    var ms = Date.now() - new Date(iso).getTime();
    var mins = Math.floor(ms / 60000);
    if (mins < 1) return "just now";
    if (mins < 60) return mins + (mins === 1 ? " min ago" : " mins ago");
    var hours = Math.floor(mins / 60);
    if (hours < 24) return hours + (hours === 1 ? " hour ago" : " hours ago");
    var days = Math.floor(hours / 24);
    return days + (days === 1 ? " day ago" : " days ago");
  }

  function initials(text) {
    if (!text) return "?";
    var words = text.trim().split(/\s+/).slice(0, 2);
    return words.map(function (w) { return w[0].toUpperCase(); }).join("");
  }

  function loadAvatarPhoto(imgEl, candidateId) {
    icareAuthFetch("/candidates/" + candidateId + "/photo").then(function (res) {
      if (!res.ok) return;
      return res.blob().then(function (blob) { imgEl.src = URL.createObjectURL(blob); });
    }).catch(function () {});
  }

  function fillAvatar(el, name, candidateId, hasPhoto) {
    el.textContent = initials(name);
    if (hasPhoto) {
      var img = document.createElement("img");
      img.alt = name;
      el.textContent = "";
      el.appendChild(img);
      loadAvatarPhoto(img, candidateId);
    }
  }

  function loadPostMedia(el, postId, tag) {
    icareAuthFetch("/candidates/posts/" + postId + "/media").then(function (res) {
      if (!res.ok) return;
      return res.blob().then(function (blob) {
        var media = document.createElement(tag);
        media.src = URL.createObjectURL(blob);
        if (tag === "video") media.controls = true;
        el.appendChild(media);
      });
    }).catch(function () {});
  }

  function renderComments(card, comments) {
    var list = card.querySelector("[data-comments-list]");
    list.innerHTML = "";
    (comments || []).forEach(function (cm) {
      var row = document.createElement("div");
      row.className = "comment-row";
      row.innerHTML = '<div class="comment-avatar"></div><div class="comment-bubble"><span class="cname"></span><span data-ctext></span></div>';
      fillAvatar(row.querySelector(".comment-avatar"), cm.full_name, cm.candidate_id, cm.has_photo);
      row.querySelector(".cname").textContent = cm.full_name || "A candidate";
      row.querySelector("[data-ctext]").textContent = cm.body;
      list.appendChild(row);
    });
  }

  function renderFeed(rows) {
    var list = document.querySelector("[data-feed-list]");
    var empty = document.querySelector("[data-feed-empty]");
    list.innerHTML = "";
    if (!rows || rows.length === 0) {
      empty.hidden = false;
      return;
    }
    empty.hidden = true;
    rows.forEach(function (post) {
      var item = document.createElement("div");
      item.className = "card feed-item";
      var who = post.full_name || "A candidate";
      var subParts = [];
      if (post.headline) subParts.push(post.headline);
      if (post.town) subParts.push(post.town);

      var mediaHtml = "";
      if (post.post_type === "photo") mediaHtml = '<div class="feed-media-photo" data-media-mount></div>';
      if (post.post_type === "video") mediaHtml = '<div class="feed-media-video" data-media-mount></div>';
      if (post.post_type === "document") {
        mediaHtml = '<div class="feed-media-doc"><div class="feed-doc-icon">FILE</div><div><div style="font-weight:700;font-size:13px;color:var(--plum-950);"></div><div style="font-family:\'IBM Plex Mono\',monospace;font-size:10px;color:var(--ink-faint);"></div></div></div>';
      }
      var checkinHtml = post.post_type === "checkin" && post.checkin_venue_name
        ? '<div class="feed-checkin">📍 Checked in at ' + post.checkin_venue_name + "</div>" : "";

      item.innerHTML =
        '<div class="feed-item-head">' +
          '<div class="feed-avatar"></div>' +
          '<div class="feed-item-meta">' +
            '<div class="feed-item-who"></div>' +
            '<div class="feed-item-sub"></div>' +
          '</div>' +
          (post.visibility === "connections" ? '<span class="feed-item-visibility">Connections only</span>' : '') +
        '</div>' +
        checkinHtml +
        (post.title ? '<div class="feed-item-title"></div>' : '') +
        '<div class="feed-item-body"></div>' +
        mediaHtml +
        '<div class="feed-mentions" data-mentions hidden></div>' +
        '<div class="feed-actions">' +
          '<button type="button" class="' + (post.my_reacted ? "liked" : "") + '" data-react>👍 Helpful' + (post.reaction_count ? " (" + post.reaction_count + ")" : "") + '</button>' +
          '<button type="button" data-toggle-comments>💬 Comment' + (post.comment_count ? " (" + post.comment_count + ")" : "") + '</button>' +
        '</div>' +
        '<div class="comments-block" data-comments-block hidden>' +
          '<div data-comments-list></div>' +
          '<div class="comment-form"><input type="text" placeholder="Write a comment…" data-comment-input /><button type="button" data-comment-submit>Send</button></div>' +
        '</div>';

      var avatarEl = item.querySelector(".feed-avatar");
      fillAvatar(avatarEl, who, post.candidate_id, post.has_photo);
      item.querySelector(".feed-item-who").textContent = who;
      item.querySelector(".feed-item-sub").textContent = (subParts.length ? subParts.join(" · ") + " · " : "") + timeAgo(post.created_at);
      if (post.title) item.querySelector(".feed-item-title").textContent = post.title;
      item.querySelector(".feed-item-body").textContent = post.body;

      if (post.post_type === "document") {
        item.querySelector(".feed-media-doc div > div").textContent = post.media_filename || "Document";
        item.querySelector(".feed-media-doc div > div + div").textContent = post.media_size_bytes ? Math.round(post.media_size_bytes / 1024) + " KB" : "";
      }
      if (post.post_type === "photo" || post.post_type === "video") {
        loadPostMedia(item.querySelector("[data-media-mount]"), post.id, post.post_type === "photo" ? "img" : "video");
      }

      jget("/candidates/posts/" + post.id + "/mentions").then(function (result) {
        if (!result.ok || !result.body.mentions || result.body.mentions.length === 0) return;
        var row = item.querySelector("[data-mentions]");
        row.hidden = false;
        row.innerHTML = "";
        result.body.mentions.forEach(function (m) {
          var chip = document.createElement("span");
          chip.className = "mention-chip";
          chip.textContent = "@" + m.full_name;
          row.appendChild(chip);
        });
      }).catch(function () {});

      item.querySelector("[data-react]").addEventListener("click", function () {
        jpost("/candidates/posts/" + post.id + "/reaction").then(function (result) {
          if (!result.ok) return;
          post.my_reacted = result.body.reacted;
          post.reaction_count = (post.reaction_count || 0) + (result.body.reacted ? 1 : -1);
          var btn = item.querySelector("[data-react]");
          btn.classList.toggle("liked", post.my_reacted);
          btn.textContent = "👍 Helpful" + (post.reaction_count ? " (" + post.reaction_count + ")" : "");
        });
      });

      var commentsLoaded = false;
      item.querySelector("[data-toggle-comments]").addEventListener("click", function () {
        var block = item.querySelector("[data-comments-block]");
        block.hidden = !block.hidden;
        if (!block.hidden && !commentsLoaded) {
          commentsLoaded = true;
          jget("/candidates/posts/" + post.id + "/comments").then(function (result) {
            if (result.ok) renderComments(item, result.body.comments);
          });
        }
      });
      item.querySelector("[data-comment-submit]").addEventListener("click", function () {
        var input = item.querySelector("[data-comment-input]");
        var text = input.value.trim();
        if (!text) return;
        jpost("/candidates/posts/" + post.id + "/comments", { body: text }).then(function (result) {
          if (!result.ok) return;
          input.value = "";
          jget("/candidates/posts/" + post.id + "/comments").then(function (r2) {
            if (r2.ok) {
              renderComments(item, r2.body.comments);
              post.comment_count = (r2.body.comments || []).length;
              item.querySelector("[data-toggle-comments]").textContent = "💬 Comment" + (post.comment_count ? " (" + post.comment_count + ")" : "");
            }
          });
        });
      });

      list.appendChild(item);
    });
  }

  function loadFeed() {
    jget("/candidates/feed").then(function (result) {
      if (result.ok) renderFeed(result.body.posts);
    });
  }

  // --- Composer: progressive-disclosure "+ Add to your post" ---
  var pendingAttachment = null; // { post_type, media_path, media_filename, media_size_bytes }
  var pendingCheckin = null; // { checkin_venue_name, checkin_employer_id }
  var pendingMentions = []; // [{id, full_name}]

  document.querySelector("[data-add-toggle]").addEventListener("click", function () {
    document.querySelector("[data-add-options]").classList.toggle("show");
  });

  document.querySelectorAll("[data-add]").forEach(function (btn) {
    btn.addEventListener("click", function () {
      var kind = btn.getAttribute("data-add");
      document.querySelector("[data-mention-search]").hidden = kind !== "mention";
      document.querySelector("[data-venue-search]").hidden = kind !== "checkin";
      if (kind === "photo" || kind === "video" || kind === "document") {
        var input = document.querySelector("[data-file-input]");
        input.accept = kind === "photo" ? "image/*" : kind === "video" ? "video/*" : "application/pdf";
        input.setAttribute("data-kind", kind);
        input.click();
      }
    });
  });

  document.querySelector("[data-file-input]").addEventListener("change", function (e) {
    var file = e.target.files[0];
    if (!file) return;
    var kind = e.target.getAttribute("data-kind");
    icareAuthFetch("/candidates/me/posts/media", {
      method: "POST",
      headers: { "Content-Type": file.type, "X-File-Name": file.name },
      body: file,
    }).then(function (res) { return res.json().then(function (b) { return { ok: res.ok, body: b }; }); })
      .then(function (result) {
        if (!result.ok) { setStatus(result.body.error || "Upload failed", true); return; }
        pendingCheckin = null;
        pendingAttachment = { post_type: kind, media_path: result.body.media_path, media_filename: result.body.media_filename || file.name, media_size_bytes: result.body.media_size_bytes };
        document.querySelector("[data-attachment-label]").textContent = (kind === "photo" ? "🖼️ " : kind === "video" ? "🎥 " : "📄 ") + (result.body.media_filename || file.name);
        document.querySelector("[data-attachment]").hidden = false;
      });
    e.target.value = "";
  });

  document.querySelector("[data-attachment-remove]").addEventListener("click", function () {
    pendingAttachment = null;
    pendingCheckin = null;
    document.querySelector("[data-attachment]").hidden = true;
  });

  var mentionTimer;
  document.querySelector("[data-mention-query]").addEventListener("input", function (e) {
    clearTimeout(mentionTimer);
    var q = e.target.value.trim();
    mentionTimer = setTimeout(function () {
      if (q.length < 2) { document.querySelector("[data-mention-results]").innerHTML = ""; return; }
      jget("/candidates/mention-search?q=" + encodeURIComponent(q)).then(function (result) {
        if (!result.ok) return;
        var box = document.querySelector("[data-mention-results]");
        box.innerHTML = "";
        (result.body.candidates || []).forEach(function (cand) {
          var row = document.createElement("div");
          row.className = "search-result-row";
          row.textContent = cand.full_name + (cand.primary_profession ? " · " + cand.primary_profession : "");
          row.addEventListener("click", function () {
            if (!pendingMentions.some(function (m) { return m.id === cand.id; })) {
              pendingMentions.push({ id: cand.id, full_name: cand.full_name });
              var textEl = document.querySelector("[data-post-body]");
              textEl.value = (textEl.value ? textEl.value + " " : "") + "@" + cand.full_name + " ";
            }
            document.querySelector("[data-mention-query]").value = "";
            box.innerHTML = "";
          });
          box.appendChild(row);
        });
      });
    }, 250);
  });

  var venueTimer, lastViewbox = null;
  document.querySelector("[data-venue-query]").addEventListener("input", function (e) {
    clearTimeout(venueTimer);
    var q = e.target.value.trim();
    venueTimer = setTimeout(function () { runVenueSearch(q); }, 300);
  });
  document.querySelector("[data-venue-use-location]").addEventListener("click", function () {
    if (!navigator.geolocation) return;
    navigator.geolocation.getCurrentPosition(function (pos) {
      var d = 0.03; // ~3km box, narrows results only — never stored or sent anywhere else
      var lat = pos.coords.latitude, lon = pos.coords.longitude;
      lastViewbox = (lon - d) + "," + (lat + d) + "," + (lon + d) + "," + (lat - d);
      runVenueSearch(document.querySelector("[data-venue-query]").value.trim());
    });
  });
  function runVenueSearch(q) {
    if (q.length < 2) { document.querySelector("[data-venue-results]").innerHTML = ""; return; }
    var url = "/candidates/checkin/venues?q=" + encodeURIComponent(q) + (lastViewbox ? "&viewbox=" + lastViewbox : "");
    jget(url).then(function (result) {
      if (!result.ok) return;
      var rows = (result.body.employers || []).map(function (e) { return { name: e.name, employer_id: e.id }; })
        .concat((result.body.places || []).map(function (p) { return { name: p.name, employer_id: null }; }));
      var box = document.querySelector("[data-venue-results]");
      box.innerHTML = "";
      rows.forEach(function (r) {
        var row = document.createElement("div");
        row.className = "search-result-row";
        row.textContent = "📍 " + r.name;
        row.addEventListener("click", function () {
          pendingAttachment = null;
          pendingCheckin = { checkin_venue_name: r.name, checkin_employer_id: r.employer_id };
          document.querySelector("[data-attachment-label]").textContent = "📍 " + r.name;
          document.querySelector("[data-attachment]").hidden = false;
          document.querySelector("[data-venue-search]").hidden = true;
        });
        box.appendChild(row);
      });
    });
  }

  var postBodyInput = document.querySelector("[data-post-body]");
  var postCharCount = document.querySelector("[data-post-char-count]");
  var selectedVisibility = "public";
  postBodyInput.addEventListener("input", function () {
    postCharCount.textContent = postBodyInput.value.length + " / 8000";
  });

  document.querySelector("[data-visibility-select]").addEventListener("click", function (e) {
    var btn = e.target.closest("[data-visibility]");
    if (!btn) return;
    selectedVisibility = btn.getAttribute("data-visibility");
    document.querySelectorAll("[data-visibility-select] .visibility-option").forEach(function (b) {
      b.classList.toggle("is-active", b === btn);
    });
  });

  function setStatus(text, isErr) {
    var statusEl = document.querySelector('[data-status="post"]');
    statusEl.textContent = text;
    statusEl.className = text ? ("status is-visible" + (isErr ? " err" : "")) : "status";
  }

  document.querySelector("[data-post-form]").addEventListener("submit", function (e) {
    e.preventDefault();
    var titleInput = document.querySelector("[data-post-title]");
    var body = postBodyInput.value.trim();
    if (!body) return;

    var payload = { title: titleInput.value.trim(), body: body, visibility: selectedVisibility, mentioned_candidate_ids: pendingMentions.map(function (m) { return m.id; }) };
    if (pendingCheckin) {
      payload.post_type = "checkin";
      payload.checkin_venue_name = pendingCheckin.checkin_venue_name;
      if (pendingCheckin.checkin_employer_id) payload.checkin_employer_id = pendingCheckin.checkin_employer_id;
    } else if (pendingAttachment) {
      Object.assign(payload, pendingAttachment);
    }

    var submitBtn = document.querySelector("[data-post-submit]");
    submitBtn.disabled = true;
    jpost("/candidates/me/posts", payload).then(function (result) {
      submitBtn.disabled = false;
      if (!result.ok) { setStatus(result.body.error || "Something went wrong. Please try again.", true); return; }
      titleInput.value = "";
      postBodyInput.value = "";
      postCharCount.textContent = "0 / 8000";
      pendingAttachment = null; pendingCheckin = null; pendingMentions = [];
      document.querySelector("[data-attachment]").hidden = true;
      document.querySelector("[data-add-options]").classList.remove("show");
      setStatus("");
      loadFeed();
    }).catch(function () {
      submitBtn.disabled = false;
      setStatus("Network error — please try again.", true);
    });
  });

  Promise.all([
    jget("/candidates/me"),
    jget("/candidates/me/shortlists"),
  ]).then(function (results) {
    var candidateResult = results[0], shortlistsResult = results[1];
    document.querySelector("[data-loading]").style.display = "none";
    if (!candidateResult.ok) {
      document.querySelector("[data-loading]").style.display = "block";
      document.querySelector("[data-loading]").textContent = "Couldn't load Rounds. Try refreshing the page.";
      return;
    }
    document.querySelector("[data-home-content]").hidden = false;

    var rows = shortlistsResult.ok ? (shortlistsResult.body.shortlists || []) : [];
    var newRows = rows.filter(function (r) { return !r.candidate_consented_at && !r.closed_at; });
    document.querySelector("[data-invites-dot]").classList.toggle("is-visible", newRows.length > 0);
    if (newRows.length > 0) {
      document.querySelector("[data-invite-strip]").hidden = false;
      document.querySelector("[data-invite-strip-text]").textContent =
        newRows.length === 1 ? "1 new invite" : newRows.length + " new invites";
    }

    loadFeed();
  }).catch(function () {
    document.querySelector("[data-loading]").textContent = "Couldn't load Rounds. Try refreshing the page.";
  });

  document.querySelector("[data-sign-out]").addEventListener("click", function () {
    icareAuthFetch("/auth/logout", { method: "POST" }).finally(function () {
      icareClearSession();
      window.location.href = "/";
    });
  });
})();
</script>
</body>
</html>
