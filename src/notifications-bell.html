<!--
  iCare notification bell — real notification center (2026-09-15), covering
  the four candidate-facing events migration 0043/0044 tracks: a connection
  request received, a connection request accepted, a new message, and a
  shortlist/interview invite.

  NOT imported by any Worker route (same convention as auth-client.js and
  nav-shell.html — see those files' own header comments). Every signed-in
  candidate page that has the shared <header class="nav"> copies the CSS
  block, the markup below, and the <script> block verbatim into its own
  page. If you change this file, update every page that copied it:
  dashboard.html, invites.html, pipelines.html, rounds.html, network.html,
  messages.html, credentials.html, visibility.html. (Not onboarding.html —
  an unpublished, unconnectable candidate can't yet be the target of any of
  these four events: candidate_discover and candidate_search both require
  is_published, and messaging requires an accepted connection, so there is
  nothing this page could ever show there.)

  Markup lives inside each page's <header class="nav">, between the logo
  and the sign-out button — wrap those two in a `.nav-right` flex container
  (was a bare two-child `justify-content: space-between` row before this;
  three children would put the bell in the middle instead of next to
  Sign out). `.nav-right` MUST carry `position: relative` — the dropdown
  panel anchors `right: 0` against it, not against the bell's own small
  wrapper div (found live at 320px width: anchoring to the immediate
  wrapper instead of the header's actual right edge left ~104px of the
  panel's width — everything left of where Sign out and the header's own
  padding sit — rendering off-screen to the left, invisible with no
  scrollbar to reveal it. Wide viewports have enough slack either way to
  hide this, which is exactly why it wasn't caught until a real,
  narrow-viewport Chromium render was checked rather than just "does the
  panel open".)

  This is the SECOND thing every page reaches for the unread count via:
  reuses this repo's existing icareAuthFetch/icareGetSession (top-level
  function declarations, not IIFE-scoped, so already global by the time
  this script block runs — no need to redefine them) but keeps its own
  small IIFE and its own jget/jpost, rather than threading through each
  page's existing business-logic IIFE. Runs independently of whether that
  page's own script has finished loading its own data.

  Supersedes the tab-bar's `data-messages-dot` (nav-shell.html), which was
  declared in markup on every page but never actually wired up anywhere —
  dead code since Sprint 23. Removed from nav-shell.html and every page
  that copied it in the same change that added this. The Invites tab's own
  `data-invites-dot` is UNCHANGED and deliberately NOT folded into this —
  that dot means "you have a shortlist still needing a decision" (business
  state, from candidate_consented_at), not "you haven't looked at this
  notification yet" (read state, from notifications.read_at). Different
  concepts; an invite notification going read doesn't make the underlying
  decision any less pending, and responding to it doesn't require having
  opened the bell first.
-->
<style>
  .notif-bell {
    position: relative; background: none; border: none; cursor: pointer;
    padding: 6px; margin: 0 2px; display: flex; align-items: center; justify-content: center;
    color: var(--ink-faint); border-radius: 999px;
  }
  .notif-bell:hover { color: var(--teal-700); background: var(--paper-dim); }
  .notif-bell svg { width: 21px; height: 21px; stroke: currentColor; fill: none; stroke-width: 1.75; stroke-linecap: round; stroke-linejoin: round; }
  .notif-bell .tab-bar-dot { top: 3px; right: 3px; }

  .notif-panel {
    position: absolute; top: calc(100% + 8px); right: 0; z-index: 60;
    width: min(380px, calc(100vw - 32px)); max-height: min(480px, calc(100vh - 100px));
    display: flex; flex-direction: column;
    background: var(--white); border: 1px solid var(--line); border-radius: 16px;
    box-shadow: var(--shadow-soft); overflow: hidden;
  }
  .notif-panel-head {
    display: flex; align-items: center; justify-content: space-between;
    padding: 14px 16px 10px; border-bottom: 1px solid var(--line); flex: none;
  }
  .notif-panel-head h2 { font-family: "Fraunces", Georgia, serif; font-size: 16px; color: var(--plum-950); margin: 0; font-weight: 600; }
  .notif-mark-all { background: none; border: none; color: var(--teal-700); font-size: 12.5px; font-weight: 600; cursor: pointer; padding: 4px; }
  .notif-mark-all:hover { text-decoration: underline; }
  .notif-mark-all[hidden] { display: none; }

  .notif-list { overflow-y: auto; flex: 1 1 auto; }
  .notif-empty, .notif-loading { padding: 32px 16px; text-align: center; color: var(--ink-faint); font-size: 13.5px; }
  .notif-empty[hidden], .notif-loading[hidden] { display: none; }

  .notif-row {
    display: flex; gap: 11px; padding: 12px 16px; text-align: left; width: 100%;
    background: none; border: none; border-bottom: 1px solid var(--line); cursor: pointer; color: inherit;
  }
  .notif-row:last-child { border-bottom: none; }
  .notif-row:hover { background: var(--paper-dim); }
  .notif-row.is-unread { background: var(--teal-100); }
  .notif-row.is-unread:hover { background: #d8f3ee; }
  .notif-avatar {
    width: 36px; height: 36px; border-radius: 999px; background: var(--paper-dim); border: 1.5px solid var(--line); flex: none;
    display: flex; align-items: center; justify-content: center; font-family: "IBM Plex Mono", monospace; font-size: 11px; color: var(--ink-faint); overflow: hidden;
  }
  .notif-avatar img { width: 100%; height: 100%; object-fit: cover; }
  .notif-body { min-width: 0; flex: 1; }
  .notif-text { font-size: 13px; line-height: 1.4; color: var(--plum-950); margin: 0; }
  .notif-text b { font-weight: 600; }
  .notif-preview { font-size: 12.5px; color: var(--ink-faint); margin: 2px 0 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .notif-time { font-size: 11px; color: var(--ink-faint); margin: 4px 0 0; }
  .notif-unread-mark { width: 8px; height: 8px; border-radius: 999px; background: var(--teal-500); flex: none; margin-top: 5px; }
</style>

<!-- Placed inside <header class="nav">, right of the logo, immediately
     before the .nav-right wrapper's sign-out button:

     <header class="nav">
       <a href="/" class="logo">i<em>Care</em></a>
       <div class="nav-right">
         ...bell markup below...
         <button class="sign-out" data-sign-out>Sign out</button>
       </div>
     </header> -->

<div>
  <button class="notif-bell" data-notif-bell aria-label="Notifications" aria-haspopup="true" aria-expanded="false">
    <svg viewBox="0 0 24 24"><path d="M18 8a6 6 0 0 0-12 0c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 0 1-3.46 0"/></svg>
    <span class="tab-bar-dot" data-notif-dot></span>
  </button>
  <div class="notif-panel" data-notif-panel hidden>
    <div class="notif-panel-head">
      <h2>Notifications</h2>
      <button class="notif-mark-all" data-notif-mark-all hidden>Mark all read</button>
    </div>
    <p class="notif-loading" data-notif-loading>Loading…</p>
    <p class="notif-empty" data-notif-empty hidden>Nothing yet — connection requests, messages and invites will show up here.</p>
    <div class="notif-list" data-notif-list></div>
  </div>
</div>

<script>
(function () {
  var session = icareGetSession();
  if (!session) return; // page's own icareRequireAuth() already handles the redirect

  function notifJget(url) {
    return icareAuthFetch(url).then(function (res) { return res.json().then(function (body) { return { ok: res.ok, status: res.status, body: body }; }); });
  }
  function notifJpost(url) {
    return icareAuthFetch(url, { method: "POST" }).then(function (res) { return res.json().then(function (body) { return { ok: res.ok, status: res.status, body: body }; }); });
  }

  function notifTimeAgo(iso) {
    var ms = Date.now() - new Date(iso).getTime();
    var mins = Math.floor(ms / 60000);
    if (mins < 1) return "just now";
    if (mins < 60) return mins + (mins === 1 ? " min ago" : " mins ago");
    var hours = Math.floor(mins / 60);
    if (hours < 24) return hours + (hours === 1 ? " hour ago" : " hours ago");
    var days = Math.floor(hours / 24);
    return days + (days === 1 ? " day ago" : " days ago");
  }
  function notifInitials(text) {
    if (!text) return "?";
    var words = text.trim().split(/\s+/).slice(0, 2);
    return words.map(function (w) { return w[0].toUpperCase(); }).join("");
  }
  function notifEscape(text) {
    var d = document.createElement("div");
    d.textContent = text || "";
    return d.innerHTML;
  }

  function notifLineFor(n) {
    var actor = notifEscape(n.actor_name || "Someone");
    if (n.type === "connection_request") return "<b>" + actor + "</b> sent you a connection request";
    if (n.type === "connection_accepted") return "<b>" + actor + "</b> accepted your connection request";
    if (n.type === "message") return "<b>" + actor + "</b> sent you a message";
    if (n.type === "invite") {
      var org = notifEscape(n.actor_org_name || "An employer");
      var job = notifEscape(n.job_title || "a role");
      return "<b>" + org + "</b> invited you to apply for " + job;
    }
    return "New notification";
  }
  function notifLinkFor(n) {
    if (n.type === "connection_request" || n.type === "connection_accepted") return "/network";
    if (n.type === "message") return "/messages?with=" + encodeURIComponent(n.actor_candidate_id);
    if (n.type === "invite") return "/invites";
    return "/dashboard";
  }
  function notifAvatarCandidateId(n) {
    return n.type === "invite" ? null : n.actor_candidate_id;
  }
  function notifAvatarName(n) {
    return n.type === "invite" ? n.actor_org_name : n.actor_name;
  }

  function loadAvatarPhoto(imgEl, candidateId) {
    icareAuthFetch("/candidates/" + candidateId + "/photo").then(function (res) {
      if (!res.ok) return;
      return res.blob().then(function (blob) { imgEl.src = URL.createObjectURL(blob); });
    }).catch(function () {});
  }
  function fillAvatar(avatarEl, name, candidateId, hasPhoto) {
    avatarEl.textContent = notifInitials(name);
    if (hasPhoto && candidateId) {
      var img = document.createElement("img");
      img.alt = name || "";
      avatarEl.textContent = "";
      avatarEl.appendChild(img);
      loadAvatarPhoto(img, candidateId);
    }
  }

  var bellEl = document.querySelector("[data-notif-bell]");
  var panelEl = document.querySelector("[data-notif-panel]");
  var dotEl = document.querySelector("[data-notif-dot]");
  var listEl = document.querySelector("[data-notif-list]");
  var emptyEl = document.querySelector("[data-notif-empty]");
  var loadingEl = document.querySelector("[data-notif-loading]");
  var markAllEl = document.querySelector("[data-notif-mark-all]");

  var loaded = false;

  function setDot(unreadCount) {
    dotEl.classList.toggle("is-visible", unreadCount > 0);
    markAllEl.hidden = unreadCount === 0;
  }

  function refreshUnreadCount() {
    notifJget("/candidates/me/notifications/unread-count").then(function (r) {
      if (r.ok) setDot(r.body.unread || 0);
    });
  }

  function renderList(rows) {
    listEl.innerHTML = "";
    loadingEl.hidden = true;
    if (!rows || rows.length === 0) { emptyEl.hidden = false; return; }
    emptyEl.hidden = true;
    rows.forEach(function (n) {
      var row = document.createElement("button");
      row.className = "notif-row" + (n.read_at ? "" : " is-unread");
      row.type = "button";

      var avatar = document.createElement("div");
      avatar.className = "notif-avatar";
      fillAvatar(avatar, notifAvatarName(n), notifAvatarCandidateId(n), n.actor_has_photo);
      row.appendChild(avatar);

      var body = document.createElement("div");
      body.className = "notif-body";
      var text = document.createElement("p");
      text.className = "notif-text";
      text.innerHTML = notifLineFor(n);
      body.appendChild(text);
      if (n.type === "message" && n.message_preview) {
        var preview = document.createElement("p");
        preview.className = "notif-preview";
        preview.textContent = n.message_preview;
        body.appendChild(preview);
      }
      var time = document.createElement("p");
      time.className = "notif-time";
      time.textContent = notifTimeAgo(n.created_at);
      body.appendChild(time);
      row.appendChild(body);

      if (!n.read_at) {
        var markEl = document.createElement("span");
        markEl.className = "notif-unread-mark";
        row.appendChild(markEl);
      }

      row.addEventListener("click", function () {
        if (!n.read_at) {
          notifJpost("/candidates/me/notifications/" + n.id + "/read").then(function () { refreshUnreadCount(); });
        }
        window.location.href = notifLinkFor(n);
      });

      listEl.appendChild(row);
    });
  }

  function loadFeed() {
    loadingEl.hidden = false;
    emptyEl.hidden = true;
    notifJget("/candidates/me/notifications").then(function (r) {
      if (r.ok) { renderList(r.body.notifications); loaded = true; }
      else { loadingEl.hidden = true; emptyEl.hidden = false; emptyEl.textContent = "Couldn't load notifications — try again shortly."; }
    });
  }

  function openPanel() {
    panelEl.hidden = false;
    bellEl.setAttribute("aria-expanded", "true");
    if (!loaded) loadFeed();
  }
  function closePanel() {
    panelEl.hidden = true;
    bellEl.setAttribute("aria-expanded", "false");
  }

  bellEl.addEventListener("click", function (e) {
    e.stopPropagation();
    if (panelEl.hidden) openPanel(); else closePanel();
  });
  document.addEventListener("click", function (e) {
    if (!panelEl.hidden && !panelEl.contains(e.target) && !bellEl.contains(e.target)) closePanel();
  });
  document.addEventListener("keydown", function (e) {
    if (e.key === "Escape" && !panelEl.hidden) closePanel();
  });
  markAllEl.addEventListener("click", function (e) {
    e.stopPropagation();
    notifJpost("/candidates/me/notifications/read-all").then(function (r) {
      if (r.ok) {
        setDot(0);
        listEl.querySelectorAll(".notif-row.is-unread").forEach(function (row) {
          row.classList.remove("is-unread");
          var mark = row.querySelector(".notif-unread-mark");
          if (mark) mark.remove();
        });
      }
    });
  });

  refreshUnreadCount();
})();
</script>
