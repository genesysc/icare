<!--
  iCare signed-in tab-bar shell — SPRINTS.md Sprint 19.

  NOT imported by any Worker route (same convention as auth-client.js —
  see that file's own header comment). Every signed-in candidate page
  copies the CSS block and the <nav class="tab-bar"> markup below
  verbatim, changing only which item carries `is-active` for that page.
  If you change this file, update every page that copied it:
  dashboard.html, invites.html, pipelines.html, rounds.html, network.html,
  messages.html, credentials.html, visibility.html. (Not onboarding.html —
  it has no tab bar; a candidate isn't in the signed-in "app" proper until
  onboarding is done.)

  Six destinations, matching docs/mockups/jobseeker-wireframes.html's
  sitemap screen plus Messages (added Sprint 24, see PROGRESS.md's
  2026-09-12 entry): Rounds, Invites, Pipelines, Network, Messages,
  Profile. `dashboard.html` is Profile (it was the only candidate page
  before Sprint 19, and its content — own headline/badges/sections/edit
  links — is what the wireframe calls Profile). "Rounds" was "Home" at
  first (Sprint 22) and was renamed later the same sprint; `/home` still
  redirects there for anyone with the old URL.

  2026-09-15 correction: credentials.html and visibility.html had drifted
  to a stale FIVE-item copy missing Messages entirely — nobody had reason
  to notice, since neither page links anywhere near Messages. Caught and
  fixed while wiring in the notification bell below, since that change
  touched every page in this list anyway. Worth remembering: "copy
  verbatim, update every page" only self-enforces on the pages someone
  actually opens again later — it's silent about the ones nobody does.

  Fixed to the bottom of the viewport at every size, not just mobile —
  this codebase has no other desktop-specific layout (every existing
  page is a single centered column, no breakpoints), so a second
  desktop-only nav pattern isn't introduced here either. Every page's
  `.wrap` already reserves 80px of bottom padding, which is exactly
  enough clearance — no page needed to change that.

  Icons are hand-authored inline SVG (no icon font/library — this repo
  has no dependency for one), simple single-stroke line icons in the
  brand teal/plum, sized 22px.

  The Messages item's own unread indicator (`data-messages-dot` on this
  tab) was declared here from the start but never actually wired up
  anywhere — dead markup since Sprint 23. Removed 2026-09-15 in favour of
  the header notification bell (src/notifications-bell.html), which
  covers unread messages as one of its four event types and is the real
  fix for "how do I know I have something new" across the whole app, not
  just this one tab. The Invites tab's `data-invites-dot` is UNCHANGED —
  see notifications-bell.html's header comment for why that one stays
  separate (business state, not read state).
-->
<style>
  .tab-bar {
    position: fixed; left: 0; right: 0; bottom: 0; z-index: 40;
    display: flex; background: var(--white); border-top: 1px solid var(--line);
    padding-bottom: env(safe-area-inset-bottom, 0);
  }
  .tab-bar-item {
    flex: 1; display: flex; flex-direction: column; align-items: center; gap: 3px;
    padding: 9px 4px 8px; text-decoration: none; color: var(--ink-faint);
    font-size: 10.5px; font-weight: 600; letter-spacing: 0.01em;
  }
  .tab-bar-item svg { width: 22px; height: 22px; stroke: currentColor; fill: none; stroke-width: 1.75; stroke-linecap: round; stroke-linejoin: round; }
  .tab-bar-item.is-active { color: var(--teal-700); }
  .tab-bar-item .tab-bar-icon-wrap { position: relative; }
  .tab-bar-dot {
    position: absolute; top: -2px; right: -4px; width: 8px; height: 8px; border-radius: 999px;
    background: var(--teal-500); border: 1.5px solid var(--white); display: none;
  }
  .tab-bar-dot.is-visible { display: block; }
</style>

<nav class="tab-bar" aria-label="Main">
  <a href="/rounds" class="tab-bar-item" data-tab="rounds">
    <svg viewBox="0 0 24 24"><polyline points="2 14 6 14 9 5 14 21 17 14 22 14"/></svg>
    <span>Rounds</span>
  </a>
  <a href="/invites" class="tab-bar-item" data-tab="invites">
    <span class="tab-bar-icon-wrap">
      <svg viewBox="0 0 24 24"><path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"/><polyline points="22 6 12 13 2 6"/></svg>
      <span class="tab-bar-dot" data-invites-dot></span>
    </span>
    <span>Invites</span>
  </a>
  <a href="/pipelines" class="tab-bar-item" data-tab="pipelines">
    <svg viewBox="0 0 24 24"><rect x="2" y="7" width="20" height="14" rx="2"/><path d="M16 21V5a2 2 0 0 0-2-2h-4a2 2 0 0 0-2 2v16"/></svg>
    <span>Pipelines</span>
  </a>
  <a href="/network" class="tab-bar-item" data-tab="network">

    <span>Network</span>
