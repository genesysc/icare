name: Daily health & social care news draft

# Drafts blog post(s) from free RSS/Google News sources and opens a PR —
# never pushes to main directly. See scripts/daily-news-draft.js and
# HANDOVER.md's blog section for the full design and why: cost was an
# explicit constraint (no paid news API), and unreviewed AI-written
# content going straight to a live, indexed page carries real
# factual/legal risk, so a human always reviews the actual Markdown in
# the PR diff before anything ships. Merging the PR is the "publish"
# step — that's all it takes, the existing deploy.yml handles the rest.

on:
  schedule:
    - cron: "0 6 * * *" # 06:00 UTC daily
  workflow_dispatch: {}

permissions:
  contents: write
  pull-requests: write

jobs:
  draft:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - run: npm install

      - name: Draft today's post(s)
        id: draft
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          UNSPLASH_ACCESS_KEY: ${{ secrets.UNSPLASH_ACCESS_KEY }}
          DAILY_NEWS_SUMMARY_DIR: ${{ runner.temp }}
        run: node scripts/daily-news-draft.js

      - name: Check whether anything was drafted
        id: check
        run: |
          if [ -f "${{ runner.temp }}/pr-title.txt" ]; then
            echo "drafted=true" >> "$GITHUB_OUTPUT"
          else
            echo "drafted=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Rebuild compiled blog content (resolves real Unsplash attribution too)
        if: steps.check.outputs.drafted == 'true'
        env:
          UNSPLASH_ACCESS_KEY: ${{ secrets.UNSPLASH_ACCESS_KEY }}
        run: npm run build:blog

      - name: Typecheck
        if: steps.check.outputs.drafted == 'true'
        run: npm run typecheck

      - name: Read PR title
        if: steps.check.outputs.drafted == 'true'
        id: pr
        run: echo "title=$(cat "${{ runner.temp }}/pr-title.txt")" >> "$GITHUB_OUTPUT"

      - name: Open a draft PR for review
        if: steps.check.outputs.drafted == 'true'
        uses: peter-evans/create-pull-request@v6
        with:
          commit-message: "Daily health & social care news draft — ${{ github.run_id }}"
          # Unique per run (not a fixed name) — a fixed branch name would
          # force-push over yesterday's still-unreviewed draft the next
          # time this fires, silently discarding it if review lags a day.
          branch: auto/daily-news-draft-${{ github.run_id }}
          delete-branch: true
          title: ${{ steps.pr.outputs.title }}
          body-path: ${{ runner.temp }}/pr-body.md
          add-paths: |
            content/posts/*.md
            src/blog-content.ts

      # "Draft ready" notification (HANDOVER_daily-news §3 Q3): email to
      # info@icareltd.com via Sender.net. Fail-safe by design — skipped
      # silently when the secrets aren't set, never fails the run.
      # Automated mail is always FROM hello@ (SENDER_FROM_EMAIL), never
      # info@ — info@ is the destination inbox here, per HANDOVER.md §2's
      # firm address-ownership rule. Needs SENDER_API_KEY (+ optional
      # SENDER_FROM_EMAIL, defaults to hello@icareltd.com) as GitHub
      # Actions secrets — not yet set, same manual step as UNSPLASH_ACCESS_KEY.
      - name: Notify founder that a draft is ready
        if: steps.check.outputs.drafted == 'true'
        continue-on-error: true
        env:
          SENDER_API_KEY: ${{ secrets.SENDER_API_KEY }}
          SENDER_FROM_EMAIL: ${{ secrets.SENDER_FROM_EMAIL }}
        run: |
          if [ -z "$SENDER_API_KEY" ]; then
            echo "SENDER_API_KEY not set — skipping draft notification email."
            exit 0
          fi
          FROM_EMAIL="${SENDER_FROM_EMAIL:-hello@icareltd.com}"
          PR_TITLE="$(cat "${{ runner.temp }}/pr-title.txt")"
          node -e "
            const title = process.argv[1].replace(/</g, '&lt;');
            const html = '<p>Today\u2019s iCare news draft is ready for review:</p><p><b>' + title + '</b></p><p>Open the PR, read the Markdown diff, check facts against the cited sources, then merge to publish.</p>';
            fetch('https://api.sender.net/v2/message/send', {
              method: 'POST',
              headers: { 'Accept': 'application/json', 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + process.env.SENDER_API_KEY },
              body: JSON.stringify({ from: { email: process.env.FROM_EMAIL, name: 'iCare' }, to: { email: 'info@icareltd.com' }, subject: 'News draft ready: ' + process.argv[1], html })
            }).then(async (r) => {
              if (!r.ok) { console.error('notify email failed: ' + r.status + ' ' + await r.text()); process.exit(1); }
              console.log('draft notification sent to info@icareltd.com');
            }).catch((e) => { console.error('notify email failed: ' + e.message); process.exit(1); });
          " "$PR_TITLE"
